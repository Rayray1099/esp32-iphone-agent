name: CI
on:
  push:
    branches: [main]
    paths: ['ios/**', 'hardware/**', 'server/**', 'tools/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['ios/**', 'hardware/**', 'server/**', 'tools/**', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: Run iPhone and iPad simulator tests (macOS runners)
        type: boolean
        default: true
      firmware:
        description: Build firmware and run ESP32 emulation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: bash tools/build_openh264.sh
      - run: xcodegen generate
      - name: Unit tests on simulator
        run: |
          sim=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for devices in ds.values() for d in devices if d["name"].startswith("${{ matrix.device }}")))')
          xcodebuild test -scheme IPhoneAgent -destination "platform=iOS Simulator,id=$sim" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.device }}-test-results
          path: ios/build-sim/Logs/Test/*.xcresult
          retention-days: 3
  firmware:
    if: github.event_name == 'workflow_dispatch' && inputs.firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/bootstrap.py && python3 tools/bundle_web.py
      - name: ESP-IDF S3 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: hardware/idf
          command: idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: s3-n8r8-firmware
          retention-days: 3
          path: |
            hardware/idf/build/*.bin
            hardware/idf/build/bootloader/*.bin
            hardware/idf/build/partition_table/*.bin
            hardware/idf/build/flasher_args.json
            hardware/idf/build/*.elf
            hardware/idf/build/*.map
      - name: Existing bplist and GOP tests
        run: make -C hardware/tests
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: pip install cryptography pillow
      - run: python tools/host_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: host-screen-fixtures
          retention-days: 3
          path: output/screens/
  emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: ESP32-S3 CPU adapter emulation
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: hardware/emulator
          command: |
            idf.py build
            python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
            . $IDF_PATH/export.sh
            python ../../tools/run_qemu.py --qemu "$(command -v qemu-system-xtensa)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-cpu-emulator-log
          retention-days: 3
          path: output/emulator/
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
