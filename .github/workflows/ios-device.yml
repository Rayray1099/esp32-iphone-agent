name: iOS device IPA for local signing
on:
  workflow_dispatch:
  push:
    branches: [feature/s3-offline-clicker]
    paths: [.github/workflows/ios-device.yml, 'ios/**']
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: bash tools/build_openh264.sh
      - run: xcodegen generate
      - name: Build for physical iPhone and iPad
        run: |
          xcodebuild build -scheme IPhoneAgent -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p unsigned/Payload
          cp -R build-device/Build/Products/Release-iphoneos/IPhoneAgent.app unsigned/Payload/
          cd unsigned
          /usr/bin/zip -qry ../ESP32-Agent-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-Agent-unsigned-device-IPA
          path: ios/ESP32-Agent-unsigned.ipa
